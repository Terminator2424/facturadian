# Base de datos MariaDB (el "MySQL" de XAMPP).
# Por defecto usa root sin clave. Para otro usuario, crea un archivo .env con DB_USER y DB_PASSWORD (ver README).
quarkus.datasource.db-kind=mariadb
quarkus.datasource.username=${DB_USER:root}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=jdbc:mariadb://127.0.0.1:3306/facturadian?createDatabaseIfNotExist=true
quarkus.datasource.db-version=10.4.0

# Hibernate: crea y actualiza las tablas solo (equivale a schema-management.strategy=update en Quarkus recientes)
quarkus.hibernate-orm.database.generation=update

# Solo accesible desde este computador
quarkus.http.host=127.0.0.1
quarkus.http.limits.max-body-size=1M

# Login por formulario
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.error-page=/login?error=true
quarkus.http.auth.form.landing-page=/facturas
quarkus.http.auth.form.cookie-name=facturadian-session
quarkus.http.auth.form.http-only-cookie=true
quarkus.http.auth.form.cookie-same-site=strict
quarkus.http.auth.form.timeout=PT30M
quarkus.http.auth.form.new-cookie-interval=PT1M

# Llave de sesión fija SOLO en desarrollo. En producción se genera una aleatoria en cada arranque.
%dev.quarkus.http.auth.session.encryption-key=facturadian-dev-llave-local-2026-xk39

# Usuario de demostración (solo en desarrollo): demo / Fact2026*Dian
%dev.app.seed-demo-user=true

# Rutas públicas y rutas protegidas
quarkus.http.auth.permission.publico.paths=/login,/registro,/css/*,/js/*,/favicon.ico,/q/openapi,/q/swagger-ui,/q/swagger-ui/*
quarkus.http.auth.permission.publico.policy=permit
quarkus.http.auth.permission.privado.paths=/*
quarkus.http.auth.permission.privado.policy=authenticated

# Cabeceras de seguridad
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Referrer-Policy".value=same-origin
quarkus.http.header."Permissions-Policy".value=geolocation=(), camera=(), microphone=()

# Swagger UI en /q/swagger-ui y documento en /q/openapi
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=FacturaDIAN
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Facturación electrónica de venta con reglas de IVA y ReteIVA

# Qute
quarkus.qute.strict-rendering=false

# Administrador unico (dueno de la tienda). Su clave se define en .env con ADMIN_PASSWORD.
# En produccion, sin ADMIN_PASSWORD no se crea el administrador.
app.admin.password=${ADMIN_PASSWORD:}
%dev.app.admin.password=${ADMIN_PASSWORD:Tienda2026*Dian}